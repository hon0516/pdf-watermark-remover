[metadata]
name = pdf-watermark-remover
version = 0.1.0
description = A local-first web tool for removing recognizable tiled Pattern watermarks from PDFs.
url = https://github.com/hon0516/pdf-watermark-remover
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.9
install_requires =
    pypdf>=5,<7
include_package_data = True

[options.packages.find]
include = watermark_remover*

[options.package_data]
watermark_remover.web = static/*.html
