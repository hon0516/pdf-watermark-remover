<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 去水印工具</title>
  <style>
    body { max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1e293b; background: #f8fafc; font: 16px system-ui, sans-serif; }
    .card { margin: 18px 0; padding: 24px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
    .drop { padding: 38px; border: 2px dashed #94a3b8; border-radius: 10px; text-align: center; }
    .drop.drag { border-color: #2563eb; background: #eff6ff; }
    .muted { color: #64748b; }
    .row { padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
    .row:last-child { border-bottom: 0; }
    .badge { margin-left: 8px; color: #166534; font-size: 13px; }
    .low { color: #92400e; }
    button { padding: 10px 16px; border: 0; border-radius: 7px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button.secondary { margin-right: 8px; background: #e2e8f0; color: #334155; }
    .hidden { display: none; }
    #error { color: #b91c1c; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>PDF 去水印工具</h1>
  <p class="muted">文件仅在本机处理，不会上传网络。</p>
  <section class="card">
    <div id="drop" class="drop">拖拽 PDF 到此处，或点击下方按钮选择文件</div>
    <p><button id="choose" type="button">选择 PDF 文件</button><input id="file" type="file" accept=".pdf,application/pdf" hidden></p>
    <p id="info" class="muted"></p>
  </section>
  <section id="review" class="card hidden">
    <h2>识别结果</h2><p id="summary"></p><div id="list"></div>
    <p><button id="reset" class="secondary" type="button">取消全部选择</button><button id="remove" type="button">确认去除水印</button></p>
  </section>
  <section id="result" class="card hidden">
    <h2>处理完成</h2><p id="done"></p><a id="download"><button type="button">下载去水印 PDF</button></a>
  </section>
  <p id="status" class="muted" role="status"></p><p id="error" role="alert"></p>
  <script>
    const byId = (id) => document.getElementById(id);
    const fileInput = byId("file");
    let taskId = null;

    byId("choose").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files[0]) analyze(fileInput.files[0]);
    });
    byId("drop").addEventListener("click", () => fileInput.click());
    byId("drop").addEventListener("dragover", (event) => {
      event.preventDefault();
      byId("drop").classList.add("drag");
    });
    byId("drop").addEventListener("dragleave", () => byId("drop").classList.remove("drag"));
    byId("drop").addEventListener("drop", (event) => {
      event.preventDefault();
      byId("drop").classList.remove("drag");
      if (event.dataTransfer.files[0]) analyze(event.dataTransfer.files[0]);
    });

    async function analyze(file) {
      byId("error").textContent = "";
      byId("status").textContent = "正在分析…";
      byId("info").textContent = `${file.name} · ${(file.size / 1048576).toFixed(2)} MB`;
      const form = new FormData();
      form.append("file", file);
      try {
        const response = await fetch("/api/analyze", { method: "POST", body: form });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "分析失败");
        taskId = result.task_id;
        byId("summary").textContent = `共 ${result.pages} 页，发现 ${result.candidates.length} 个候选对象。请确认后再处理。`;
        byId("list").replaceChildren();
        if (!result.candidates.length) {
          const empty = document.createElement("p");
          empty.className = "muted";
          empty.textContent = "未发现可识别的水印对象。";
          byId("list").append(empty);
        }
        for (const candidate of result.candidates) {
          const row = document.createElement("div");
          row.className = "row";
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.dataset.id = candidate.id;
          checkbox.checked = Boolean(candidate.default_selected);
          const title = document.createElement("strong");
          title.textContent = candidate.label;
          const badge = document.createElement("span");
          badge.className = `badge${candidate.confidence < 0.7 ? " low" : ""}`;
          badge.textContent = `${Math.round(candidate.confidence * 100)}% · ${candidate.safe ? "可安全处理" : "需确认"}`;
          const detail = document.createElement("small");
          detail.className = "muted";
          detail.textContent = `第 ${candidate.page} 页 · ${candidate.description}`;
          label.append(checkbox, " ", title, badge, document.createElement("br"), detail);
          row.append(label);
          byId("list").append(row);
        }
        byId("review").classList.remove("hidden");
        byId("result").classList.add("hidden");
      } catch (error) {
        byId("error").textContent = error.message;
      } finally {
        byId("status").textContent = "";
      }
    }

    byId("reset").addEventListener("click", () => {
      document.querySelectorAll("[data-id]").forEach((input) => { input.checked = false; });
    });
    byId("remove").addEventListener("click", async () => {
      if (!taskId) return;
      byId("error").textContent = "";
      byId("status").textContent = "正在生成文件…";
      const selected = [...document.querySelectorAll("[data-id]:checked")].map((input) => input.dataset.id);
      try {
        const response = await fetch("/api/remove", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: taskId, selected }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "生成失败");
        byId("done").textContent = `已处理 ${result.pages} 页，移除 ${result.removed.length} 个对象。`;
        byId("download").href = result.download;
        byId("download").download = result.filename;
        byId("result").classList.remove("hidden");
      } catch (error) {
        byId("error").textContent = error.message;
      } finally {
        byId("status").textContent = "";
      }
    });
  </script>
</body>
</html>
